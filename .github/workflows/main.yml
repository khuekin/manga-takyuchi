name: Build Tachiyomi Drive APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Tự động sửa thư viện và mã nguồn
      run: |
        cd TachiyomiDriveApp
        # 1. Sửa phiên bản thư viện Google Drive sang bản chuẩn chính thức trên Maven Central
        sed -i 's/v3-rev20240502-2.0.0/v3-rev20220815-2.0.0/g' gradle/libs.versions.toml
        # 2. Xóa dòng play-services bị lỗi dấu gạch ngang
        sed -i '/play-services/d' app/build.gradle.kts
        # 3. Sửa hàm lưu trang trong MainActivity
        sed -i 's/mutableIntOrNullStateOf(1)/mutableStateOf(1)/g' app/src/main/java/com/tachiyomi/drive/MainActivity.kt

    - name: Set up Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Build APK with Gradle
      run: |
        cd TachiyomiDriveApp
        gradle assembleDebug --stacktrace --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: TachiyomiDrive-Debug-APK
        path: TachiyomiDriveApp/app/build/outputs/apk/debug/*.apk
        retention-days: 14
